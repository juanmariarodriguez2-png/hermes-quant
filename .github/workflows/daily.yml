name: Hermes daily run

# Runs every night after the daily candles close (00:00 UTC) and after Kraken's
# tokenized stocks reopen for the week (Sunday 8 pm New York = 01:00 UTC in winter).
#
# Three slots, not one: GitHub's scheduler is best-effort and can skip a slot without a
# word (it skipped the very first night, 16 Nov 2026). The run is idempotent per daily
# candle, so whichever slot fires first does the day's work and the others trade nothing.
on:
  schedule:
    - cron: "23 1 * * *"
    - cron: "53 2 * * *"
    - cron: "23 4 * * *"
  workflow_dispatch: {}

# Nothing by default: each job below asks for exactly what it needs. These explicit
# grants are enough on their own; no repository setting has to be changed for them.
permissions: {}

concurrency:
  group: hermes-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # save the day's state back to the repository
      pages: read       # find out whether the dashboard can be published
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Model, orders, dashboard data
        env:
          # paper | live. Leave unset for paper trading.
          HERMES_MODE: ${{ vars.HERMES_MODE || 'paper' }}
          HERMES_PROFILE: ${{ vars.HERMES_PROFILE || 'balanced' }}
          # Real orders are only sent when this repository variable is exactly "yes".
          HERMES_LIVE_ARMED: ${{ vars.HERMES_LIVE_ARMED || 'no' }}
          HERMES_MAX_ORDER_EUR: ${{ vars.HERMES_MAX_ORDER_EUR || '100' }}
          HERMES_REBASE: ${{ vars.HERMES_REBASE || 'no' }}
          # "yes" only if Kraken accepts tokenized-stock orders by API from the account
          # (it does not for accounts in the European Economic Area).
          HERMES_TOKENIZED_API: ${{ vars.HERMES_TOKENIZED_API || 'no' }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m hermes_quant.live.run_daily

      - name: Save state back to the repository
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add data/live site/live.json
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git push

      # The dashboard is served by GitHub Pages (free on public repositories) once it is
      # switched on: Settings > Pages > Source: GitHub Actions. Until then it is skipped
      # with a notice; trading state is already saved by the step above.
      - name: Can the dashboard be published?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>&1); then
            if [ "$source" = "workflow" ]; then
              publish=true
            else
              publish=false
              why="GitHub Pages deploys from a branch; switch its source to GitHub Actions"
            fi
          elif echo "$source" | grep -q "HTTP 404"; then
            publish=false
            why="GitHub Pages is not switched on (Settings > Pages > Source: GitHub Actions)"
          else
            publish=true    # could not tell: try, and let a real problem show
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          [ "$publish" = true ] || echo "::notice::Dashboard not published: $why. Trading state was saved."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.publish == 'true'
        with:
          path: site

  # Publishing follows GitHub's own pattern: a separate job in the github-pages
  # environment, which is what the Pages deployment API checks.
  publish:
    needs: run
    if: needs.run.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # create the deployment
      id-token: write   # prove it comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
