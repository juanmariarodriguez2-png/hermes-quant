name: Kraken connection check

# A dry run against the real account, started by hand: read-only calls plus orders
# sent with Kraken's "validate" flag, which the exchange checks and discards.
# Nothing is placed and no money moves. See hermes_quant/live/check_kraken.py.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dry run against Kraken (nothing is placed)
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        run: python -m hermes_quant.live.check_kraken
