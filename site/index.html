<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Hermes Quant</title>
<meta name="description" content="A systematic multi-asset trading model: what it sees today, what it holds, and the out-of-sample evidence behind it.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a risk report you can operate. One column of full-width sections on a cool
   page plane; inside each, a 12-col grid of quiet surfaces. Data is the only loud thing. */
:root {
  --page: #f3f5f8; --surface: #fdfdfe; --inset: #f5f7fa; --ink: #0e1420; --ink-2: #4a5263; --muted: #7d8696;
  --hair: #e2e6ec; --axis: #c5cbd5; --accent: #2a78d6; --accent-soft: #e4eefb;
  --c-crypto: #eb6834; --c-equity: #1baf7a; --c-real: #eda100; --c-stock: #7a5fd0; --c-neg: #e34948; --c-idle: #c9ced6;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --mid: #eef0f3; --ring: rgba(14, 20, 32, 0.10);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0b0e13; --surface: #171b22; --inset: #1e232c; --ink: #eef1f5; --ink-2: #b9c0cc; --muted: #8a93a3;
    --hair: #272d37; --axis: #3a4250; --accent: #3987e5; --accent-soft: #16263d;
    --c-crypto: #d95926; --c-equity: #199e70; --c-real: #c98500; --c-stock: #8f6fe0; --c-neg: #e66767; --c-idle: #4a5261;
    --good: #0ca30c; --good-ink: #37c437; --warn: #fab219; --serious: #ec835a; --crit: #e05a5a;
    --mid: #2a303a; --ring: rgba(255, 255, 255, 0.10); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0b0e13; --surface: #171b22; --inset: #1e232c; --ink: #eef1f5; --ink-2: #b9c0cc; --muted: #8a93a3;
  --hair: #272d37; --axis: #3a4250; --accent: #3987e5; --accent-soft: #16263d;
  --c-crypto: #d95926; --c-equity: #199e70; --c-real: #c98500; --c-stock: #8f6fe0; --c-neg: #e66767; --c-idle: #4a5261;
  --good: #0ca30c; --good-ink: #37c437; --warn: #fab219; --serious: #ec835a; --crit: #e05a5a;
  --mid: #2a303a; --ring: rgba(255, 255, 255, 0.10); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.5 var(--sans); }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 22px; line-height: 1.25; }
h3 { font-size: 15px; line-height: 1.35; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--hair); }
.bar .wrap { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 600; font-size: 16px; }
.brand small { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: 0.04em; }
.bar .spacer { flex: 1 1 auto; }
.stamp { font: 400 12px/1.3 var(--mono); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; font: 500 12px/1 var(--mono); color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--hair); font: 500 11.5px/1.4 var(--mono); letter-spacing: 0.03em; white-space: nowrap; color: var(--ink-2); background: var(--surface); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.pill.link { text-decoration: none; } .pill.link:hover { border-color: var(--accent); color: var(--ink); }
.pill.good i { background: var(--good); } .pill.warn i { background: var(--warn); } .pill.serious i { background: var(--serious); } .pill.crit i { background: var(--crit); } .pill.info i { background: var(--accent); }

/* sections */
section { padding-block: 28px; }
section + section { border-top: 1px solid var(--hair); }
.head { display: grid; gap: 6px; margin-bottom: 18px; max-width: 74ch; }
.eyebrow { font: 500 11.5px/1.2 var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-2); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.card { grid-column: span 12; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 16px; min-width: 0; }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; }
@media (max-width: 900px) { .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } }
.card > h3 { margin-bottom: 4px; }
.card > .sub { color: var(--ink-2); font-size: 13.5px; margin-bottom: 12px; max-width: 70ch; }
.note { font-size: 13px; color: var(--ink-2); margin-top: 10px; max-width: 78ch; }

/* hero */
.hero { padding-block: 26px 24px; }
.hero h1 { font-size: clamp(26px, 4.2vw, 40px); line-height: 1.12; max-width: 22ch; }
.hero .lede { margin-top: 10px; max-width: 62ch; font-size: 16px; }
.hero-grid { display: grid; gap: 22px 28px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: end; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }
.account { display: grid; gap: 6px; }
.account .label { font: 500 11.5px/1.2 var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.account .value { font-size: clamp(44px, 7vw, 64px); line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
.account .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; color: var(--ink-2); font-size: 14px; }
.delta { font-weight: 600; } .delta.up { color: var(--good-ink); } .delta.down { color: var(--crit); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 22px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile .k { font-size: 12.5px; color: var(--ink-2); }
.tile .v { font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
.tile .d { font-size: 12.5px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; margin-top: 4px; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* tables */
/* A wide table scrolls sideways inside its card; a soft edge shows on the side that still hides columns. */
.scroll { overflow-x: auto; background:
  linear-gradient(90deg, var(--surface) 45%, transparent) left / 30px 100% no-repeat local,
  linear-gradient(270deg, var(--surface) 45%, transparent) right / 30px 100% no-repeat local,
  linear-gradient(90deg, var(--axis), transparent) left / 12px 100% no-repeat scroll,
  linear-gradient(270deg, var(--axis), transparent) right / 12px 100% no-repeat scroll; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font: 500 11px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 8px 0; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--hair); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; padding-left: 10px; padding-right: 18px; }
tr > td:last-child, tr > th:last-child { padding-right: 0; }
td.num { white-space: nowrap; }
tr.lead td { font-weight: 600; }
#fav .ph { display: none; } #fav .asset b { white-space: nowrap; }
@media (max-width: 560px) {
  th { white-space: normal; font-size: 10.5px; letter-spacing: 0.02em; }
  td.r, th.r { padding-left: 4px; padding-right: 8px; }
  table .prob { grid-template-columns: 64px auto; } #fav .prob { grid-template-columns: 44px auto; }
  #metrics tr > :nth-child(3) { display: none; } /* volatility: Sharpe and worst loss carry the risk on a phone */
  #fav .pd { display: none; } /* favourites: the status moves under the company's name, the 30-day change goes */
  #fav .ph { display: block; margin-top: 5px; } #fav .ph .pill { white-space: normal; border-radius: 10px; }
}
.asset { display: grid; gap: 1px; min-width: 9ch; } .asset b { font-weight: 500; } .asset span { font: 400 11.5px/1.2 var(--mono); color: var(--muted); }
.chip { display: inline-block; padding: 1px 7px; border-radius: 4px; font: 500 11px/1.5 var(--mono); background: var(--inset); color: var(--ink-2); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.prob { display: grid; grid-template-columns: 96px auto; gap: 8px; align-items: center; }
.prob .track { position: relative; height: 8px; background: var(--mid); border-radius: 4px; }
.prob .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.prob .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.wbar { display: grid; grid-template-columns: 70px auto; gap: 8px; align-items: center; }
.wbar .track { height: 8px; background: var(--inset); border-radius: 4px; overflow: hidden; }
.wbar .track span { display: block; height: 100%; border-radius: 4px; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--sans); font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 1px; flex: none; }
.legend i.box { height: 10px; width: 10px; border-radius: 2px; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14); min-width: 150px; max-width: 260px; }
.tip .t { font: 500 11px/1.3 var(--mono); color: var(--muted); margin-bottom: 4px; }
.tip .r { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: center; line-height: 1.5; }
.tip .r i { height: 2px; border-radius: 1px; } .tip .r b { font-weight: 600; font-variant-numeric: tabular-nums; } .tip .r span { color: var(--ink-2); }
.toggle { border: 1px solid var(--hair); background: var(--surface); border-radius: 7px; padding: 4px 9px; font: 500 12px/1.3 var(--mono); color: var(--ink-2); cursor: pointer; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.heat { display: grid; gap: 2px; font: 500 10.5px/1 var(--mono); }
.heat .c { aspect-ratio: 1; border-radius: 2px; display: grid; place-items: center; min-width: 0; }
.heat .h { display: grid; place-items: center; color: var(--muted); overflow: hidden; }
.scale { display: flex; align-items: center; gap: 8px; font: 400 11px/1 var(--mono); color: var(--muted); margin-top: 10px; }
.scale i { flex: 1; height: 6px; border-radius: 3px; max-width: 180px; }

/* method, legacy, footer */
.steps { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); counter-reset: s; }
@media (max-width: 900px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.step { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.step::before { counter-increment: s; content: "0" counter(s); font: 500 12px/1 var(--mono); color: var(--accent); }
.step p { font-size: 13.5px; color: var(--ink-2); }
.step code { font: 400 12px/1.4 var(--mono); color: var(--muted); }
.vs { display: grid; gap: 0; }
.vs .rowv { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; align-items: baseline; }
.vs .rowv:last-child { border-bottom: 0; }
.vs .rowv.h { font: 500 11px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-bottom-color: var(--axis); }
.vs .rowv > :first-child { color: var(--ink-2); }
.callout { border-left: 3px solid var(--warn); background: var(--inset); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13.5px; color: var(--ink-2); max-width: 86ch; }
footer { padding-block: 26px 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--hair); }
footer p + p { margin-top: 6px; }
@media (prefers-reduced-motion: no-preference) { .meter > span, .wbar .track span, .prob .fill { transition: width 0.5s ease; } }
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <div class="brand">Hermes Quant <small id="ver">v2</small></div>
  <span class="pill" id="modePill"><i></i><span>—</span></span>
  <a class="pill link info" href="terminal.html"><i></i><span data-t="nav.term"></span></a>

  <span class="stamp" id="stamp"></span>
  <div class="seg" role="group" aria-label="Language"><button id="lang-es" type="button">ES</button><button id="lang-en" type="button">EN</button></div>
</div></div>

<main>
<div class="wrap" id="alerts" hidden style="padding-block:14px 0"></div>

    <div>
      <div class="eyebrow" data-t="hero.eyebrow"></div>

</div></section>

<section><div class="wrap">
  <div class="head"><div class="eyebrow" data-t="see.eyebrow"></div><h2 data-t="see.title"></h2><p class="lede" data-t="see.lede"></p></div>

    <div class="card"><div class="tools"><h3 data-t="see.table"></h3><span class="muted mono" id="barDate" style="font-size:12px"></span></div>

<section><div class="wrap">

<script>
"use strict";
/* ---------------------------------------------------------------- text */
const TXT = {
