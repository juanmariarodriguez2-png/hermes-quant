<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hermes Terminal</title>
<meta name="description" content="Live view of the Hermes Quant trading model: streaming Kraken prices, live candles, the model's signals, the account and the log of its last run.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* A trading terminal: one dark plane cut into panes by hairlines, monospace throughout,
   amber for labels, and colour on data only. Market data streams from Kraken's public
   feed; everything the model decided comes from live.json, written once a night. */
:root {
  color-scheme: dark;
  --page: #06080b; --panel: #0c1016; --inset: #121821; --hair: #1c2430; --axis: #2c3644;
  --ink: #e8ebf0; --ink-2: #aab2bf; --muted: #7a8594;
  --amber: #f0a92b; --amber-mark: #c98500;      /* label text / chart mark */
  --up: #1eae7d; --down: #cb4343;               /* chart marks (validated as a pair for colour-blind readers) */
  --up-ink: #3fca94; --down-ink: #f27777;       /* signed numbers: always beside a sign or an arrow */
  --blue: #3987e5; --blue-ink: #6aa8f5;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 12.5px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
a { color: var(--blue-ink); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
[hidden] { display: none !important; }
.up { color: var(--up-ink); } .down { color: var(--down-ink); } .flat { color: var(--ink-2); }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); } .amber { color: var(--amber); }
.r { text-align: right; }

/* top bar */
.top { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--hair); }
.brand { font: 600 13.5px/1 var(--mono); letter-spacing: 0.1em; white-space: nowrap; } .brand b { color: var(--amber); font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--hair); border-radius: 3px; font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; color: var(--ink-2); text-transform: uppercase; }
.tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.tag.good i { background: var(--up); } .tag.warn i { background: var(--amber-mark); } .tag.info i { background: var(--blue); } .tag.bad i { background: var(--down); }
.kv { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; text-transform: uppercase; } .kv b { color: var(--ink); font-weight: 500; }
.spacer { flex: 1 1 auto; }
.cmd { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hair); background: var(--inset); padding: 2px 8px; border-radius: 3px; }
.cmd span { color: var(--amber); } .cmd input { width: 15ch; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; text-transform: uppercase; }
.cmd input::placeholder { color: var(--muted); text-transform: none; }
.cmd:focus-within { border-color: var(--amber); }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 3px 8px; font-size: 11px; letter-spacing: 0.05em; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--amber); color: #111; font-weight: 600; }
.navl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }

/* ticker tape */
.tape { overflow: hidden; border-bottom: 1px solid var(--hair); background: var(--page); white-space: nowrap; }
.tape .run { display: inline-flex; gap: 26px; padding: 5px 13px; }
.tape .it { display: inline-flex; gap: 7px; align-items: baseline; font-size: 11.5px; } .tape .it b { font-weight: 500; color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) {
  .tape .run { animation: slide 80s linear infinite; } .tape:hover .run { animation-play-state: paused; }
  @keyframes slide { to { transform: translateX(-50%); } }
  tr.tick-up td { animation: flashUp 0.7s ease-out; } tr.tick-down td { animation: flashDown 0.7s ease-out; }
  @keyframes flashUp { from { background: rgba(30, 174, 125, 0.22); } to { background: transparent; } }
  @keyframes flashDown { from { background: rgba(203, 67, 67, 0.24); } to { background: transparent; } }
  .log .ln { animation: appear 0.25s ease-out both; } @keyframes appear { from { opacity: 0; transform: translateY(3px); } }
}
@media (prefers-reduced-motion: reduce) { .tape { overflow-x: auto; } }

/* panes */
.grid { display: grid; gap: 1px; background: var(--hair); border-bottom: 1px solid var(--hair);
  grid-template-columns: 372px minmax(0, 1fr) 318px; grid-template-areas: "watch chart acct" "watch model acct"; }
.grid.two { grid-template-columns: minmax(0, 1fr) 500px; grid-template-areas: "log book"; }
.pane { background: var(--panel); min-width: 0; padding: 10px 12px 12px; }
.pane > h2 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 10px; margin-bottom: 8px; font: 500 11px/1.3 var(--mono); letter-spacing: 0.11em; text-transform: uppercase; color: var(--amber); }
.pane > h2 small { color: var(--muted); font-size: 11px; letter-spacing: 0.03em; text-transform: none; font-weight: 400; }
.watch { grid-area: watch; display: flex; flex-direction: column; min-height: 0; } .watch .scroll { flex: 1 1 0; min-height: 0; overflow-y: auto; margin-right: -6px; padding-right: 6px; }
.chart { grid-area: chart; } .model { grid-area: model; } .acct { grid-area: acct; } .log { grid-area: log; } .book { grid-area: book; }
.chips { display: none; }
@media (max-width: 1180px) {
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "chart" "model" "acct" "watch"; }
  .grid.two { grid-template-columns: minmax(0, 1fr); grid-template-areas: "log" "book"; }
  .watch .scroll { flex: none; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -12px 8px; padding: 0 12px 4px; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid var(--hair); background: var(--inset); border-radius: 3px; padding: 4px 9px; font-size: 11.5px; color: var(--ink-2); cursor: pointer; }
  .chips button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
}
@media (max-width: 700px) { .cmd { display: none; } }
table { border-collapse: collapse; width: 100%; }
th { font: 400 10.5px/1.3 var(--mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0 6px 5px 0; white-space: nowrap; }
th.r, td.r { text-align: right; padding-right: 0; padding-left: 6px; }
td { padding: 4px 6px 4px 0; border-top: 1px solid var(--hair); white-space: nowrap; vertical-align: middle; }

/* watchlist */
#watch tbody tr { cursor: pointer; } #watch tbody tr:hover td { background: var(--inset); }
#watch tr[aria-selected="true"] td { background: var(--inset); } #watch tr[aria-selected="true"] td:first-child { box-shadow: inset 2px 0 0 var(--amber); }
#watch { font-size: 12px; } #watch td:first-child { padding-left: 8px; }
#watch .grp td { border-top: 0; padding: 9px 0 3px 8px; font-size: 10.5px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; cursor: default; background: transparent !important; }
.sym { display: grid; line-height: 1.25; } .sym b { font-weight: 500; } .sym span { font: 400 10.5px/1.2 var(--sans); color: var(--muted); max-width: 13ch; overflow: hidden; text-overflow: ellipsis; }
.pbar { display: inline-grid; grid-template-columns: 30px auto; gap: 5px; align-items: center; }
.pbar .tr { position: relative; height: 6px; background: var(--inset); border: 1px solid var(--hair); border-radius: 2px; }
.pbar .tr::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--axis); }
.pbar .tr i { position: absolute; top: 0; bottom: 0; }

/* chart */
.cbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 4px; }
.cbar .px { font: 600 22px/1.1 var(--mono); letter-spacing: -0.01em; } .cbar .nm { color: var(--ink-2); font-family: var(--sans); font-size: 12.5px; }
.ohlc { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--ink-2); min-height: 17px; } .ohlc span b { font-weight: 400; color: var(--muted); margin-right: 4px; }
.cv { position: relative; height: 372px; margin-top: 4px; } .cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }   /* the bitmap is larger on dense screens; the box is not */
@media (max-width: 1180px) { .cv { height: 300px; } }
/* TradingView's embedded chart: their widget, their data. Shown instead of the canvas when chosen. */
.tv { height: 430px; margin-top: 6px; } .tv .tradingview-widget-container, .tv .tradingview-widget-container__widget, .tv iframe { width: 100%; height: 100%; border: 0; }
.chart.tvmode #ivs, .chart.tvmode .ohlc, .chart.tvmode .cv { display: none; }
.note { font: 400 12px/1.45 var(--sans); color: var(--ink-2); margin-top: 6px; max-width: 80ch; }

/* model */
.mgrid { display: grid; gap: 12px 18px; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); align-items: start; }
@media (max-width: 700px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 12px; }
.stat { display: grid; gap: 1px; min-width: 0; } .stat span { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); } .stat b { font: 500 15px/1.25 var(--mono); }
.stat.wide { grid-column: 1 / -1; } .stat.wide b { font: 400 12.5px/1.45 var(--sans); color: var(--ink-2); }
.svgc { position: relative; } .svgc svg { display: block; width: 100%; height: auto; overflow: visible; }
.svgc text { font: 400 10.5px var(--mono); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 11px; color: var(--ink-2); margin-bottom: 4px; } .legend span { display: inline-flex; gap: 6px; align-items: center; } .legend i { width: 14px; height: 2px; }
.tip { position: absolute; z-index: 4; pointer-events: none; background: var(--inset); border: 1px solid var(--axis); border-radius: 3px; padding: 5px 8px; font-size: 11.5px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); }
.tip .t { color: var(--muted); margin-bottom: 2px; } .tip .rw { display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center; } .tip .rw i { height: 2px; }

/* account */
.nav { font: 600 28px/1.1 var(--mono); letter-spacing: -0.02em; }
.rows { display: grid; gap: 0; margin-top: 8px; } .rows .rw { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid var(--hair); } .rows .rw span { color: var(--muted); }
.sub { margin: 14px 0 6px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.hand { border: 1px solid var(--amber-mark); border-radius: 3px; padding: 8px 10px; margin-top: 12px; background: rgba(201, 133, 0, 0.07); }
.hand h3 { margin: 0 0 5px; font: 500 10.5px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); }
.hand .o { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; } .hand p { font: 400 11.5px/1.45 var(--sans); color: var(--ink-2); margin-top: 6px; }
.meter { display: grid; gap: 3px; margin-top: 8px; } .meter .hd { display: flex; justify-content: space-between; gap: 8px; } .meter .hd span { color: var(--muted); }
.meter .tr { position: relative; height: 6px; background: var(--inset); border: 1px solid var(--hair); border-radius: 2px; overflow: hidden; } .meter .tr i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); }

/* log, book, prints */
.log .lines { display: grid; gap: 1px; }
.ln { display: grid; grid-template-columns: 62px 74px minmax(0, 1fr); gap: 8px; padding: 2px 0; white-space: normal; }
.ln time { color: var(--muted); } .ln b { font-weight: 500; color: var(--amber); letter-spacing: 0.05em; } .ln span { color: var(--ink-2); overflow-wrap: anywhere; } .ln.hot span { color: var(--ink); }
.bk { display: grid; gap: 12px 22px; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1fr); }
@media (max-width: 480px) { .bk { grid-template-columns: minmax(0, 1fr); } }
.bk td { padding: 2px 6px 2px 0; border-top: 0; font-size: 11.5px; position: relative; } .bk td.r { padding-right: 0; }
.bk .lv td:last-child { width: 46%; } .bk .lv .q { position: absolute; right: 0; top: 2px; bottom: 2px; opacity: 0.28; }
.bk .spread td { color: var(--muted); padding: 4px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); font-size: 11px; white-space: normal; }
.caption { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
footer { padding: 12px max(12px, env(safe-area-inset-right, 0px)) 22px max(12px, env(safe-area-inset-left, 0px)); font: 400 11.5px/1.5 var(--sans); color: var(--muted); max-width: 110ch; }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand"><b>HERMES</b> TERMINAL</h1>
  <span class="tag" id="mode"><i></i><span>—</span></span>
  <span class="tag" id="feed" role="status" aria-live="polite"><i></i><span>—</span></span>
  <span class="kv"><span data-t="clock"></span> <b id="clock">--:--:--</b></span>
  <span class="kv"><span data-t="next"></span> <b id="count">--:--:--</b></span>
  <span class="spacer"></span>
  <label class="cmd"><span aria-hidden="true">&gt;</span><input id="cmd" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12"></label>
  <a class="navl" href="./" data-t="panel"></a>
  <a class="navl" href="https://github.com/juanmariarodriguez2-png/hermes-quant" data-t="code"></a>
  <span class="seg" role="group" aria-label="Language"><button id="lang-es" type="button">ES</button><button id="lang-en" type="button">EN</button></span>
</header>
<div class="tape" aria-hidden="true"><div class="run" id="tape"></div></div>

<main class="grid">
  <section class="pane watch" aria-labelledby="h-watch">
    <h2 id="h-watch"><span data-t="watch"></span><small data-t="watchSub"></small></h2>
    <div class="scroll"><table id="watch"></table></div>
  </section>

  <section class="pane chart" aria-labelledby="h-chart">
    <h2 id="h-chart"><span data-t="market"></span>
      <span class="seg" role="group" id="views" aria-label="Chart"><button type="button" data-view="hermes">Hermes</button><button type="button" data-view="tv">TradingView</button></span>
      <span class="seg" role="group" id="ivs" aria-label="Interval"><button type="button" data-iv="15">15m</button><button type="button" data-iv="60">1H</button><button type="button" data-iv="240">4H</button><button type="button" data-iv="1440">1D</button></span></h2>
    <div class="chips" id="chips" role="group"></div>
    <div class="cbar"><span class="px" id="cPx">—</span><span id="cChg" class="flat"></span><span class="nm" id="cName"></span></div>
    <div class="ohlc" id="ohlc"></div>
    <div class="cv"><canvas id="cv" role="img" aria-label=""></canvas></div>
    <div class="tv" id="tv" hidden></div>
    <p class="note" id="cNote" hidden></p>
  </section>

  <section class="pane model" aria-labelledby="h-model">
    <h2 id="h-model"><span data-t="model"></span><small id="modelSub"></small></h2>
    <div class="mgrid">
      <div class="stats" id="stats"></div>
      <div>
        <div class="legend" id="mLegend"></div>
        <div class="svgc" id="mChart"></div>
        <div class="legend" id="pLegend" style="margin-top:8px"></div>
        <div class="svgc" id="pChart"></div>
      </div>
    </div>
  </section>

  <section class="pane acct" aria-labelledby="h-acct">
    <h2 id="h-acct"><span data-t="acct"></span><small id="acctSub"></small></h2>
    <div class="nav" id="nav">—</div>
    <div id="navSub" class="ink2" style="margin-top:3px"></div>
    <div class="rows" id="acctRows"></div>
    <div class="hand" id="hand" hidden></div>
    <div class="sub" data-t="positions"></div>
    <div id="pos"></div>
    <div class="sub" data-t="risk"></div>
    <div id="risk"></div>
  </section>

</main>
<div class="grid two">
  <section class="pane log" aria-labelledby="h-log">
    <h2 id="h-log"><span data-t="log"></span><small id="logSub"></small></h2>
    <div class="lines" id="log"></div>
  </section>

  <section class="pane book" aria-labelledby="h-book">
    <h2 id="h-book"><span data-t="book"></span><small id="bookSub"></small></h2>
    <div class="bk">
      <div><div class="caption" data-t="depth"></div><table id="ladder"></table></div>
      <div><div class="caption" data-t="prints"></div><table id="prints"></table></div>
    </div>
  </section>
</div>
<footer><p data-t="foot"></p></footer>

  const run = LIVE.meta.generated_at, fresh = run !== loggedRun; loggedRun = run;
  $("#logSub").textContent = `${T("lastRun")}: ${dateFmt(run, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "UTC" })} UTC`;
  $("#log").replaceChildren(...buildLog().map((l, i) => h("div", { class: "ln" + (l.hot ? " hot" : ""), style: fresh && !reduced ? `animation-delay:${i * 70}ms` : "animation:none" }, h("time", { text: l.at }), h("b", { text: l.tag }), h("span", { text: l.text }))));
}

/* ------------------------------------------------------------------ book and tape */
function renderBook() {
  const tb = $("#ladder"), asks = [...book.asks.entries()].sort((a, b) => a[0] - b[0]).slice(0, 7), bids = [...book.bids.entries()].sort((a, b) => b[0] - a[0]).slice(0, 7);
  if (!asks.length && !bids.length) { tb.replaceChildren(h("tbody", {}, h("tr", {}, h("td", { class: "muted", text: T("wait") })))); return; }
  const max = Math.max(...asks.map(l => l[1]), ...bids.map(l => l[1]), 1e-12), d = dec((asks[0] || bids[0])[0]);
  const row = ([p, q], side) => h("tr", { class: "lv" }, h("td", { class: side === "ask" ? "down" : "up", text: px(p, d) }), h("td", { class: "r" }, h("i", { class: "q", style: `width:${Math.max(2, q / max * 100)}%;background:var(--${side === "ask" ? "down" : "up"})` }), h("span", { style: "position:relative", text: qty(q) })));
  const sp = asks.length && bids.length ? asks[0][0] - bids[0][0] : null;
  tb.replaceChildren(h("thead", {}, h("tr", {}, h("th", { text: T("b.px") }), h("th", { class: "r", text: T("b.qty") }))),
    h("tbody", {}, ...asks.slice().reverse().map(l => row(l, "ask")), h("tr", { class: "spread" }, h("td", { colspan: 2, text: sp == null ? "" : `${T("spread")} ${px(sp, d)} · ${pct(sp / asks[0][0], 3)}` })), ...bids.map(l => row(l, "bid"))));
}
function renderPrints() {
  const tb = $("#prints");
  if (!prints.length) { tb.replaceChildren(h("tbody", {}, h("tr", {}, h("td", { class: "muted", text: T("wait") })))); return; }
  tb.replaceChildren(h("thead", {}, h("tr", {}, h("th", { text: T("b.time") }), h("th", { class: "r", text: T("b.px") }), h("th", { class: "r", text: T("b.qty") }))),
    h("tbody", {}, ...prints.map(p => h("tr", {}, h("td", { class: "muted", text: hms(p.t) }), h("td", { class: "r " + (p.side === "buy" ? "up" : "down"), text: `${p.side === "buy" ? "▲" : "▼"} ${px(p.p)}` }), h("td", { class: "r", text: qty(p.q) })))));
}

/* ------------------------------------------------------------------ clock, commands, boot */
function tick() {
  const now = new Date(); $("#clock").textContent = hms(now.getTime());
  const [hh, mm] = schedule_utc(), next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), hh, mm, 0)); if (next <= now) next.setUTCDate(next.getUTCDate() + 1);
  const s = Math.floor((next - now) / 1000); $("#count").textContent = `${two(Math.floor(s / 3600))}:${two(Math.floor(s % 3600 / 60))}:${two(s % 60)}`;
  if (wsOpen && lastMsg && Date.now() - lastMsg > 20000) { try { ws.close(); } catch (e) {} }
}
function renderAll() { renderStatic(); if (!LIVE) return; renderWatch(); renderHead(); renderModel(); renderAcct(); renderLog(); renderBook(); renderPrints(); renderTV(); dirty.chart = true; schedule(); }
const ALIAS = { ORO: "GLD", GOLD: "GLD", PLATA: "SLV", SILVER: "SLV", BITCOIN: "BTC", ETHEREUM: "ETH", SP500: "SPY", "S&P": "SPY", NASDAQ: "QQQ", XBT: "BTC",
  NVIDIA: "NVDA", TESLA: "TSLA", APPLE: "AAPL", GOOGLE: "GOOGL", ALPHABET: "GOOGL", MICROSOFT: "MSFT", AMAZON: "AMZN", FACEBOOK: "META", SPACEX: "SPCX" };
$("#cmd").addEventListener("keydown", (e) => { if (e.key !== "Enter") return; const raw = e.target.value.trim().toUpperCase().replace(/X?\/(EUR|USD)$/, ""), s = ALIAS[raw] || raw, hit = M.has(s) ? s : [...M.keys()].find(k => k.startsWith(s)); if (hit && select(hit)) { e.target.value = ""; e.target.blur(); } });
document.addEventListener("keydown", (e) => { if (e.key === "/" && document.activeElement !== $("#cmd")) { e.preventDefault(); $("#cmd").focus(); } });
$("#watch").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-s]"); if (tr) select(tr.dataset.s); });
$("#chips").addEventListener("click", (e) => { const b = e.target.closest("button[data-s]"); if (b) select(b.dataset.s); });
$("#watch").addEventListener("keydown", (e) => { const tr = e.target.closest("tr[data-s]"); if (!tr) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(tr.dataset.s); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const rows = [...document.querySelectorAll("#watch tr[data-s]")], i = rows.indexOf(tr) + (e.key === "ArrowDown" ? 1 : -1); if (rows[i]) { rows[i].focus(); select(rows[i].dataset.s); } } });
$("#ivs").addEventListener("click", (e) => { const b = e.target.closest("button[data-iv]"); if (!b || +b.dataset.iv === interval) return; interval = +b.dataset.iv; renderStatic(); subscribeSelected(); loadCandles(); });
$("#views").addEventListener("click", (e) => { const b = e.target.closest("button[data-view]"); if (!b || b.dataset.view === view) return; view = b.dataset.view; try { localStorage.setItem("hq-view", view); } catch (e2) {} renderHead(); renderTV(); dirty.chart = true; schedule(); });
for (const l of ["es", "en"]) $("#lang-" + l).addEventListener("click", () => { lang = l; try { localStorage.setItem("hq-lang", l); } catch (e) {} renderAll(); });

const getLive = () => fetch("live.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
renderStatic(); setFeed("wait"); tick(); setInterval(tick, 1000);
getLive().then((l) => {
  if (!l) { $("#log").replaceChildren(h("div", { class: "ln" }, h("time", { text: "" }), h("b", { text: "!" }), h("span", { text: "live.json" }))); return; }
  LIVE = l; buildMarkets(); renderAll();
  const want = decodeURIComponent(location.hash.slice(1)).toUpperCase(); select(M.has(want) ? want : M.has("BTC") ? "BTC" : M.keys().next().value);
  connect();
  setInterval(async () => { const n = await getLive(); if (!n || n.meta.generated_at === LIVE.meta.generated_at) return; LIVE = n; for (const a of [...n.model.assets, ...stockRows()]) { const m = M.get(a.symbol); if (m) m.a = a; } renderAll(); }, 300000);
});
</script>
